name: Build and Test

on: [push, pull_request]

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        asan: ['OFF', 'ON']
        include:
          - compiler: gcc
            cxx: g++
          - compiler: clang
            cxx: clang++

    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:detect_stack_use_after_return=1

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y build-essential cmake libgtest-dev libboost-all-dev

    - name: Configure CMake
      run: >-
        cmake -B build -DCMAKE_BUILD_TYPE=Debug
        -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DUSE_ASAN=${{ matrix.asan }}
      
    - name: Build
      run: cmake --build build --parallel 2

    - name: Run tests
      run: ctest --test-dir build --output-on-failure
      
    - name: Run README example
      run: timeout 20s ./build/readme_example
